<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc"><title id="title">RubyDB server topology</title><desc id="desc">Web and worker processes use verified TLS to connect to a private RubyDB server that owns persistent database storage.</desc><rect width="820" height="260" rx="18" fill="#f7f9fb"/><text x="35" y="42" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23394b">Many application processes, one storage owner</text><rect x="36" y="73" width="156" height="58" rx="9" fill="#e8f0f6" stroke="#b6cad9"/><text x="114" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#27455b">Web process</text><rect x="36" y="160" width="156" height="58" rx="9" fill="#e8f0f6" stroke="#b6cad9"/><text x="114" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#27455b">Job worker</text><path d="M193 102h92m-92 87h92m0-87v87m0-43h75" fill="none" stroke="#ad4d50" stroke-width="3"/><text x="323" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#a74c50">TLS</text><path d="M349 138h52" stroke="#ad4d50" stroke-width="3"/><path d="m393 130 10 8-10 8" fill="none" stroke="#ad4d50" stroke-width="3"/><rect x="405" y="93" width="170" height="90" rx="11" fill="#e6edf6" stroke="#adc1d4"/><text x="490" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#25455e">RubyDB server</text><text x="490" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64798a">private network</text><path d="M576 138h63" stroke="#ad4d50" stroke-width="3"/><path d="m630 130 11 8-11 8" fill="none" stroke="#ad4d50" stroke-width="3"/><rect x="644" y="93" width="143" height="90" rx="11" fill="#fae9e7" stroke="#e6b2ae"/><text x="715" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#984248">Persistent</text><text x="715" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#986469">database path</text></svg>
