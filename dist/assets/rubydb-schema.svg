<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Projects and tasks schema</title><desc id="desc">Projects has id and name; tasks has id, project_id, title, and done. Tasks project_id references projects id.</desc><rect width="760" height="300" rx="18" fill="#f7f9fb"/><rect x="44" y="52" width="258" height="196" rx="12" fill="#fff" stroke="#cbd9e2" stroke-width="2"/><path d="M44 64a12 12 0 0 1 12-12h234a12 12 0 0 1 12 12v40H44z" fill="#e6edf6"/><text x="67" y="84" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263e53">projects</text><text x="67" y="143" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">id</text><text x="264" y="143" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#a44c50">PRIMARY KEY</text><text x="67" y="189" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">name</text><text x="264" y="189" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#7a8997">UNIQUE</text><rect x="461" y="28" width="258" height="243" rx="12" fill="#fff" stroke="#cbd9e2" stroke-width="2"/><path d="M461 40a12 12 0 0 1 12-12h234a12 12 0 0 1 12 12v40H461z" fill="#fae9e7"/><text x="484" y="60" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#923e44">tasks</text><text x="484" y="113" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">id</text><text x="484" y="155" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">project_id</text><text x="484" y="197" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">title</text><text x="484" y="239" font-family="Arial,sans-serif" font-size="16" fill="#334b5d">done</text><path d="M304 137h71q23 0 23 18t22 18h38" fill="none" stroke="#b14a51" stroke-width="3"/><circle cx="304" cy="137" r="5" fill="#b14a51"/><path d="m448 165 11 8-11 8" fill="none" stroke="#b14a51" stroke-width="3"/><text x="381" y="126" text-anchor="middle" font-family="Aria