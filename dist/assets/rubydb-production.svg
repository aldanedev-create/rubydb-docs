<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 315" role="img" aria-labelledby="title desc"><title id="title">Production operations for RubyDB</title><desc id="desc">Applications connect to a private RubyDB server. The server owns persistent storage; backups are verified and stored separately, and monitoring observes the service.</desc><rect width="850" height="315" rx="18" fill="#f7f9fb"/><text x="34" y="43" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#253b4d">Production responsibilities</text><rect x="34" y="112" width="145" height="75" rx="10" fill="#e8f0f6" stroke="#b8cad7"/><text x="106" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b475d">Applications</text><text x="106" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#587082">web + workers</text><path d="M180 149h88" stroke="#ae4c50" stroke-width="3"/><path d="m259 141 11 8-11 8" fill="none" stroke="#ae4c50" stroke-width="3"/><rect x="273" y="109" width="160" height="81" rx="10" fill="#e6edf6" stroke="#adc3d5"/><text x="353" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2b475d">RubyDB server</text><text x="353" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#587082">private · TLS · auth</text><path d="M434 149h82" stroke="#ae4c50" stroke-width="3"/><path d="m508 141 11 8-11 8" fill="none" stroke="#ae4c50" stroke-width="3"/><rect x="523" y="109" width="136" height="81" rx="10" fill="#fae9e7" stroke="#e7b7b4"/><text x="591" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#934248">Persistent</text><text x="591" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#916265">storage</text><path d="M661 149h44v75h-94" fill="none" stroke="#ae4c50" stroke-width="3"/><path d="m621 216-11 8 11 8" fill="none" stroke="#ae4c50" stroke-width="3"/><rect x="448" y="234" width="230" height="56" rx="10" fill="#fff" stroke="#d1dce3"/><text x="563" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#314a5c">Verified off-host backup</text><text x="563" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#708293">plus restore drills</text><path d="M353 191v47h-75" fill="none" stroke="#8a9eb0" stroke-width="3"/><rect x="151" y="234" width="185" height="56" rx="10" fill="#fff" stroke="#d1dce3"/><text x="243" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#314a5c">Monitoring</text><text x="243" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#708293">alerts + runbook</text></svg>
